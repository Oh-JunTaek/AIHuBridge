name: News Refresh

# 이 이름은 deploy.yml의 workflow_run과 연결되어 있으므로 함께 변경해야 한다.
# 뉴스·AI 일정을 수집하고 성공한 실행을 배포 워크플로로 연결한다.
# - GitHub 자신의 저장소에서 동작하므로 개인 계정 키 불필요 (GITHUB_TOKEN 자동)
# - 고용24 인증키는 저장소의 Actions 비밀값에서만 읽는다.

on:
  # UTC 기준. 매일 KST(UTC+9) 07:00 한 번 실행한다.
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:   # 브라우저에서 수동 수동 새로고침

permissions:
  contents: write       # github-actions[bot] 의 커밋/푸시 권한

concurrency:
  group: ai-content-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: 마지막 정상 데이터 불러오기
        env:
          DATA_BRANCH_REQUIRED: '1'
        run: node scripts/load-data-branch.mjs
      - name: RSS 수집 (npm run refresh)
        run: npm run refresh
      - name: 고용24 훈련과정 수집
        continue-on-error: true
        env:
          WORK24_API_KEY: ${{ secrets.WORK24_API_KEY }}
        run: node scripts/fetch-funded-training.mjs
      - name: 고용24 직업·직무·공통코드·채용행사 수집
        continue-on-error: true
        env:
          WORK24_JOB_API_KEY: ${{ secrets.WORK24_JOB_API_KEY }}
          WORK24_DUTY_API_KEY: ${{ secrets.WORK24_DUTY_API_KEY }}
          WORK24_CODES_API_KEY: ${{ secrets.WORK24_CODES_API_KEY }}
          WORK24_RECRUITMENT_API_KEY: ${{ secrets.WORK24_RECRUITMENT_API_KEY }}
        run: node scripts/fetch-work24-careers.mjs
      - name: 수집 로직 회귀 검사
        run: npm test
      - name: 데이터·타입·빌드 검증
        run: |
          npm run lint
          npm run selfcheck
          npm run build
      - name: 수집 결과 검증 (0건이면 푸시 중단)
        run: |
          node --input-type=commonjs -e "const m=require('./public/data/meta.json');const t=m.total;console.log('수집 건수: '+t);if(!t||t===0){console.error('뉴스 0건 -> 커밋·푸시 건너뜀');process.exit(1)}"
      - name: 데이터 브랜치 갱신
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          data_tree="$RUNNER_TEMP/aihubridge-data"
          if git show-ref --verify --quiet refs/remotes/origin/data-refresh; then
            git worktree add --detach "$data_tree" refs/remotes/origin/data-refresh
          else
            git worktree add --detach "$data_tree" HEAD
          fi
          for name in news.json meta.json calendar.json calendar-meta.json funded-training.json work24-jobs.json work24-duties.json work24-codes.json work24-events.json; do
            cp "public/data/$name" "$data_tree/public/data/$name"
          done
          git -C "$data_tree" add public/data/news.json public/data/meta.json public/data/calendar.json public/data/calendar-meta.json public/data/funded-training.json public/data/work24-jobs.json public/data/work24-duties.json public/data/work24-codes.json public/data/work24-events.json
          if ! git -C "$data_tree" diff --staged --quiet; then
            git -C "$data_tree" commit -m "data: 자동 정보 수집 갱신 $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          fi
          git -C "$data_tree" push origin HEAD:refs/heads/data-refresh
      - name: 갱신 결과 요약
        run: node scripts/refresh-summary.mjs
