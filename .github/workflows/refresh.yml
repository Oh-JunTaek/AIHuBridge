name: News Refresh

# 이 이름은 deploy.yml의 workflow_run과 연결되어 있으므로 함께 변경해야 한다.
# 뉴스·AI 일정을 수집하고 성공한 실행을 배포 워크플로로 연결한다.
# - GitHub 자신의 저장소에서 동작하므로 개인 계정 키 불필요 (GITHUB_TOKEN 자동)
# - 외부 서비스 계정/키 미보관 (AGENTS.md rule 3 준수)

on:
  # UTC 기준. KST(UTC+9) 07:00 / 19:00 에 해당.
  schedule:
    - cron: '0 22,10 * * *'
  workflow_dispatch:   # 브라우저에서 수동 수동 새로고침

permissions:
  contents: write       # github-actions[bot] 의 커밋/푸시 권한

concurrency:
  group: ai-content-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: RSS 수집 (npm run refresh)
        run: npm run refresh
      - name: 수집 로직 회귀 검사
        run: npm test
      - name: 데이터·타입·빌드 검증
        run: |
          npm run lint
          npm run selfcheck
          npm run build
      - name: 수집 결과 검증 (0건이면 푸시 중단)
        run: |
          node --input-type=commonjs -e "const m=require('./public/data/meta.json');const t=m.total;console.log('수집 건수: '+t);if(!t||t===0){console.error('뉴스 0건 -> 커밋·푸시 건너뜀');process.exit(1)}"
      - name: 자동 커밋 & 푸시 (데이터 변경 시)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/news.json public/data/meta.json public/data/calendar.json public/data/calendar-meta.json
          if ! git diff --staged --quiet; then
            git commit -m "data: 자동 뉴스 수집 갱신 $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          else
            echo '변경 없음 - 푸시를 건너뜁니다'
          fi
      - name: 갱신 결과 요약
        run: node scripts/refresh-summary.mjs
